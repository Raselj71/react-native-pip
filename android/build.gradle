plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.reactnativepip'
version = '1.0.0'

android {
  namespace "expo.modules.reactnativepip"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  compileOnly "androidx.activity:activity:1.8.0"
}
